<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2577bf">
  <meta name="description" content="Aplicativo de lista de compras para supermercados.">
  <title>Shop Vibes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="src/style/style.css" onerror="AddLoadError('src/style/style.css')">
</head>
<body>
  <div class="app-container">
    <!-- Header Navbar -->
    <header class="app-header">
      <h1 class="app-title">Shop Vibes</h1>
      <div class="header-actions">
        <div id="network-status" class="status-badge online">
          <span class="status-dot"></span> Online
        </div>
        <button id="btn-open-modal" class="btn-add-list" aria-label="Nova Lista" title="Nova Lista">
          <img src="src/img/icons/plus.svg" alt="Nova Lista" width="20" height="20">
        </button>
      </div>
    </header>

    <!-- Update Banner -->
    <div id="update-banner" class="update-banner hidden">
      <span>Nova atualização disponível!</span>
      <button id="btn-update" class="btn-update">Atualizar Agora</button>
    </div>

    <!-- Main Content Shell -->
    <main id="app-content" class="app-content"></main>

    <!-- Modal Popup for New Shop List -->
    <div id="modal-new-list" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <h2 id="modal-title" class="modal-title">Nova Lista de Compras</h2>
        <form id="form-new-list">
          <div class="form-group">
            <label for="input-store-name" class="form-label">Nome do Mercado</label>
            <input type="text" id="input-store-name" class="form-input" placeholder="Nome do supermercado" required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="input-list-date" class="form-label">Data da Lista</label>
            <input type="date" id="input-list-date" class="form-input" required>
          </div>
          <div class="modal-actions">
            <button type="button" id="btn-cancel-modal" class="btn-secondary">Cancelar</button>
            <button type="submit" id="btn-submit-modal" class="btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
    <pre id="displayErrors" style="display: none; background: #f29797; padding: 1em;"></pre>
  </div>

  <script>
    let errorsCaught = [];
    function AddLoadError(s){
      AddError("Could not load " + s);
    }
    function AddError(s){
      errorsCaught.push(
        (s && s.message)
        || (s && s.reason && s.reason.message)
        || s
        || "An error occured");
      while (errorsCaught.length > 3)
        errorsCaught.shift();
      displayErrors.innerText += errorsCaught.join("\n");
      displayErrors.style.display = "block";
    }
    window.onerror = AddError;
    window.onunhandledrejection = AddError;
    let originalConsoleError = console.error;
    console.error = function (...args){
      AddError(args[0]);
      originalConsoleError(...args);
    }
  </script>

  <script src="src/scripts/app.js" defer onerror="AddLoadError('src/scripts/app.js')"></script>
</body>
</html>
